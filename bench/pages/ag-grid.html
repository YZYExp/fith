<!doctype html><html><head><meta charset="utf-8"><title>AG Grid</title><link rel="stylesheet" href="../.cache/node_modules/ag-grid-community/styles/ag-grid.css"><link rel="stylesheet" href="../.cache/node_modules/ag-grid-community/styles/ag-theme-alpine.css"><script src="../.cache/node_modules/ag-grid-community/dist/ag-grid-community.min.js"></script>
<style>body{margin:0;font-family:sans-serif}#g{height:700px;width:1100px;margin:20px}</style></head><body><div id="g" class="ag-theme-alpine"></div><script>
const rows=Array.from({length:40},(_,i)=>({id:1000+i,name:['Ada','Alan','Grace','Linus','Margaret','Dennis'][i%6]+' '+(i+1),country:['UK','US','NL','FI','FR'][i%5],sales:Math.round(1000+Math.sin(i)*800+i*37),active:i%3!==0}));
agGrid.createGrid(document.getElementById('g'),{rowData:rows,columnDefs:[{field:'id',checkboxSelection:true,width:130},{field:'name',filter:true},{field:'country'},{field:'sales',valueFormatter:p=>'$'+p.value.toLocaleString(),cellStyle:p=>p.value>1500?{color:'#0a0',fontWeight:'bold'}:null},{field:'active',cellRenderer:p=>p.value?'✔ yes':'✘ no'}],defaultColDef:{sortable:true,resizable:true,flex:1},animateRows:false,suppressColumnVirtualisation:true,suppressRowVirtualisation:true});
</script></body></html>
