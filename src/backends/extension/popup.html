<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; width: 260px; padding: 14px;
        font: 13px/1.4 system-ui, sans-serif; color: #1f2937; background: #fff;
      }
      h1 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
      label { display: block; margin: 0 0 4px; color: #6b7280; font-size: 12px; }
      select {
        width: 100%; padding: 6px 8px; margin-bottom: 12px; font: inherit;
        border: 1px solid #d1d5db; border-radius: 6px; background: #fff;
      }
      .btns { display: flex; gap: 8px; }
      button {
        flex: 1; font: inherit; padding: 8px 10px; border-radius: 6px; cursor: pointer;
        border: 1px solid #1677ff; background: #1677ff; color: #fff;
      }
      button.secondary { background: #fff; color: #1677ff; }
      button:disabled, select:disabled { opacity: .6; cursor: wait; }
      .hint { margin: 10px 0 0; color: #9ca3af; font-size: 11px; }
      #status { margin-top: 8px; font-size: 12px; color: #16a34a; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>Convert page to SVG</h1>

    <label for="scope">Capture area</label>
    <select id="scope">
      <option value="viewport">Visible area (fast)</option>
      <option value="full">Full page (no scrolling)</option>
    </select>

    <label for="output">Output</label>
    <select id="output">
      <option value="both">Download + preview</option>
      <option value="download">Download only</option>
      <option value="preview">Preview only</option>
    </select>

    <label for="font">Fonts</label>
    <select id="font">
      <option value="embed">Embed (selectable text)</option>
      <option value="outline">Outline (glyph paths)</option>
      <option value="none">Reference by name</option>
    </select>

    <div class="btns">
      <button id="page">Capture page</button>
      <button id="pick" class="secondary">Pick element</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <p class="hint">Pick element: hover to highlight, click to convert, Esc to cancel.</p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
