name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Build extension bundle
        run: npm run build:extension

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npm test
        env:
          # Point visual tests at the Playwright-managed Chromium (full build,
          # not the @sparticuz headless shell) so extension.test.ts can also
          # load extensions when needed.
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/playwright

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-out
          path: test/visual/__out__/
          if-no-files-found: ignore

  extension-e2e:
    runs-on: ubuntu-latest
    # Only run the full E2E (needs a real extension-capable Chromium) on pushes
    # to main or claude/* branches, not on every PR to keep CI fast.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (full build, supports extensions)
        run: npx playwright install chromium --with-deps

      - name: Run extension E2E test
        run: EXTENSION_E2E=1 npx vitest run test/visual/extension-e2e.test.ts
        env:
          # The Playwright-managed chromium-<rev>/chrome-linux64/chrome binary
          # supports loading unpacked extensions (unlike the headless shell).
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/playwright
