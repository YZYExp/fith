<!doctype html>
<html>
  <head>
    <style>
      body { margin: 0; background: #fff; font-family: sans-serif; padding: 20px; }
      .row { display: flex; gap: 16px; margin-bottom: 16px; }
      .box { width: 160px; height: 100px; border-radius: 12px; }
      .a { background: linear-gradient(90deg, #ff6a00 0%, #ee0979 100%); }
      .b { background: linear-gradient(180deg, #2193b0, #6dd5ed); }
      .c { background: linear-gradient(45deg, #00b09b 0%, #96c93d 100%); }
      .d { background: linear-gradient(to right, #f7971e, #ffd200); }
      .e { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6b8dd6 100%); }
      .f { background: linear-gradient(0deg, rgba(255,0,0,0.2), rgba(0,0,255,0.9)); }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
    <div class="row">
      <div class="box d"></div>
      <div class="box e"></div>
      <div class="box f"></div>
    </div>
  </body>
</html>
