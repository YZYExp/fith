<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font:16px 'DejaVu Sans',sans-serif;width:440px;height:360px;position:relative}
.a{position:absolute;left:10px;top:10px;width:120px;height:60px;border-radius:10px;background:#f5e6dc;box-shadow:inset 0 0 14px 3px #d97757}
.b{position:absolute;left:150px;top:10px;width:130px;height:60px;transform:perspective(220px) rotateY(18deg);background:#d97757;color:#fff;padding:6px;box-sizing:border-box}
.b span{display:block;font-weight:bold}
.c{position:absolute;left:300px;top:20px;width:90px;height:40px;background:#3a6ea5;color:#fff;transform:rotate(12deg);padding:4px;box-sizing:border-box}
.d{position:absolute;left:10px;top:100px;width:130px;height:70px;background:linear-gradient(90deg,#f00,#00f);transform:perspective(260px) rotateX(18deg)}
.e{position:absolute;left:10px;top:100px;width:130px;height:40px;background:#ff0}
.f{position:absolute;left:160px;top:100px;width:100px;height:60px;transform:perspective(200px) rotateY(-20deg)}
.f::before{content:"\25A3  hi";display:block;font-size:22px;color:#222}
canvas{position:absolute;left:290px;top:100px}
.g{position:absolute;left:10px;top:200px;width:160px;height:80px;transform:perspective(300px) rotateY(12deg);background:#fff;border:2px solid #222;border-radius:12px;padding:6px;box-sizing:border-box}
input.h{position:absolute;left:200px;top:210px;width:140px;font:14px sans-serif}
</style></head><body>
<div class="a"></div>
<div class="b"><span>Filtered text</span>child</div>
<div class="c">Rotated</div>
<div class="e"></div><div class="d"></div>
<div class="f"></div>
<canvas id="cv" width="100" height="60"></canvas>
<div class="g">Drop shadow <b>card</b></div>
<input class="h" value="form value">
<script>const x=document.getElementById('cv').getContext('2d');x.fillStyle='#2a9d8f';x.fillRect(0,0,100,60);x.fillStyle='#e9c46a';x.beginPath();x.arc(50,30,20,0,7);x.fill();</script>
</body></html>
