<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:#f4f1ea;font:700 15px sans-serif}
.t{display:inline-block;width:150px;height:96px;margin:8px;vertical-align:top;position:relative}
.card{width:100%;height:100%;box-sizing:border-box;padding:8px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#e8553d,#2a7fd4)}
.card span{display:block;margin-top:6px;background:#fff;color:#222;border-radius:6px;padding:2px 6px;width:max-content}
.g .card{filter:grayscale(.85)}
.s .card{filter:sepia(.9) saturate(1.4)}
.h .card{filter:hue-rotate(120deg) brightness(1.15) contrast(1.1)}
.d .card{filter:drop-shadow(6px 6px 5px rgba(0,0,0,.45))}
.b .card{filter:blur(2px)}
.m .card{mix-blend-mode:multiply;background:#f6c}
.df .card{mix-blend-mode:difference;background:#fff}
.bg{position:absolute;inset:0;background:linear-gradient(90deg,#2a7fd4 50%,#ffd23f 50%)}
</style></head><body>
<div class="t g"><div class="card">gray<span>chip</span></div></div><div class="t s"><div class="card">sepia<span>chip</span></div></div>
<div class="t h"><div class="card">hue<span>chip</span></div></div><div class="t d"><div class="card">shadow<span>chip</span></div></div>
<div class="t b"><div class="card">blur<span>chip</span></div></div>
<div class="t"><div class="bg"></div><div class="t m" style="margin:0;position:absolute;left:30px;top:20px;width:100px;height:60px"><div class="card">multiply</div></div></div>
<div class="t"><div class="bg"></div><div class="t df" style="margin:0;position:absolute;left:30px;top:20px;width:100px;height:60px"><div class="card">diff</div></div></div>
</body></html>
