<!doctype html>
<style>
body { margin: 16px; background: white; font: 28px/1.5 sans-serif; }
.clipped { width: 440px; padding: 16px; margin-bottom: 20px; color: black;
  -webkit-text-fill-color: transparent; background-clip: text; }
.gradient { background-image: linear-gradient(90deg, #ef4444, #2563eb); }
.solid { background-color: #16a34a; }
.override { -webkit-text-fill-color: #2563eb; }
</style>
<div class="clipped gradient">Parent <strong>bold nested text</strong><br><span>Second <em>nested line</em></span></div>
<div class="clipped solid">Solid <strong>nested text</strong> <span class="override">blue override</span></div>
