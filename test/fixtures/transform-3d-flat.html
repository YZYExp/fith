<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:20px;background:#fff;font:700 16px sans-serif}
.a{width:140px;height:60px;background:#2a7fd4;color:#fff;padding:8px;box-sizing:border-box;transform:translateZ(500px)}       /* no perspective: no visual effect */
.b{width:140px;height:60px;background:#e8553d;color:#fff;padding:8px;box-sizing:border-box;margin-top:12px;transform:translate3d(30px,0,200px)}
.c{width:140px;height:60px;background:#2a7;color:#fff;padding:8px;box-sizing:border-box;margin-top:12px;transform:rotateX(50deg)} /* orthographic foreshortening */
</style></head><body><div class="a">translateZ</div><div class="b">translate3d</div><div class="c">rotateX ortho</div></body></html>
