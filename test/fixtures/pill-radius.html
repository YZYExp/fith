<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:20px;background:#fff;font:14px sans-serif}
.track{width:200px;height:8px;background:#ddd;border-radius:9999px;margin-bottom:14px}.fill{width:75%;height:8px;background:#4f46e5;border-radius:9999px}
.pill{display:inline-block;padding:6px 16px;border-radius:9999px;background:#e8553d;color:#fff;margin-right:8px}
.dot{width:14px;height:14px;border-radius:9999px;background:#2a7;display:inline-block}
.wide{width:220px;height:30px;border-radius:50%;background:#2a7fd4;margin-top:12px}
</style></head><body><div class="track"><div class="fill"></div></div><span class="pill">Pill</span><span class="dot"></span><div class="wide"></div></body></html>
