<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:#eef;font:14px sans-serif}
.b{display:inline-block;width:150px;height:90px;margin:8px;box-sizing:border-box;padding:10px;border-radius:14px;vertical-align:top}
.a{background:#fff;box-shadow:inset 0 0 14px 2px rgba(0,0,0,.45)}
.c{background:#ffd;box-shadow:inset 6px 8px 12px -2px rgba(200,0,0,.6),0 2px 6px rgba(0,0,0,.2)}
.d{background:#222;color:#fff;border:3px solid #4f8cff;box-shadow:inset 0 0 20px #4f8cff}
.e{background:linear-gradient(#fff,#ddd);box-shadow:inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 6px rgba(0,0,0,.25)}
</style></head><body><div class="b a">soft inner</div><div class="b c">offset + neg spread</div><div class="b d">glow + border</div><div class="b e">two layers</div></body></html>
