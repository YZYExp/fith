<!doctype html>
<html>
  <head>
    <style>
      /* body has a non-vectorizable background-image (radial-gradient) and the
         wrapper has a ::before — both are box-level effects. Previously either
         one would raster the whole subtree and, if the raster couldn't be made,
         leave a blank SVG. Content must still be vectorized. */
      body { margin: 0; background: radial-gradient(circle at 30% 20%, #ffecec, #e8eeff); font-family: sans-serif; }
      .wrap { position: relative; padding: 40px; }
      .wrap::before { content: ''; position: absolute; inset: 0; border: 2px solid #ccc; }
      .card { background: #fff; border: 1px solid #d9d9d9; border-radius: 10px; padding: 16px; width: 280px; }
      h1 { margin: 0 0 8px; font-size: 18px; color: #1677ff; }
      p { margin: 0; color: #334155; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Container Fallback</h1>
        <p>This text must be vectorized even though body and the wrapper carry box-level effects.</p>
      </div>
    </div>
  </body>
</html>
