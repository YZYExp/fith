<!doctype html><html><head><style>
body{margin:0;background:#fff}
.hero{position:relative;height:320px;overflow:hidden;background:#fff;font:700 40px sans-serif}
.hero::before{content:"";position:absolute;left:40px;top:40px;width:220px;height:220px;border-radius:50%;background:#7fbf5f;filter:blur(40px);opacity:.7}
.glow{position:absolute;right:60px;top:60px;width:160px;height:160px;border-radius:24px;background:#4f8cff;filter:blur(24px)}
.t{position:relative;padding:120px 0 0 120px}
</style></head><body><div class="hero"><div class="glow"></div><div class="t">Glow</div></div></body></html>
