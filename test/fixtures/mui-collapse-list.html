<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f5f5f5; }
      .list { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
      .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      .card-header { padding: 12px 16px; display: flex; justify-content: space-between; }
      .card-title { font-weight: 600; }

      /* MUI Collapse pattern: overflow:hidden + a height smaller than content,
         simulating the transition-not-quite-done state where wrapper height
         lags slightly behind scrollHeight. The first item happens to fully
         fit, but items 2+ are clipped — this is the failure mode the user hit. */
      .collapse {
        min-height: 0px;
        height: 30px;
        overflow: hidden;
      }
      .collapse-wrapper {
        display: flex;
        width: 100%;
      }
      .collapse-inner {
        width: 100%;
      }
      .body { padding: 16px; }
      .row { display: flex; gap: 8px; margin-bottom: 8px; }
      .pill {
        padding: 4px 10px; border: 1px solid #d1d5db; border-radius: 999px;
        background: #f9fafb; font-size: 12px;
      }
      .desc { color: #6b7280; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="list">
      <div class="card">
        <div class="card-header"><div class="card-title">card-one</div><div>⋯</div></div>
        <div class="collapse">
          <div class="collapse-wrapper"><div class="collapse-inner">
            <div class="body">
              <div class="row"><span class="pill">IF</span><span class="pill">contains @@@</span></div>
              <div class="desc">First card body — should appear in SVG</div>
            </div>
          </div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">card-two</div><div>⋯</div></div>
        <div class="collapse">
          <div class="collapse-wrapper"><div class="collapse-inner">
            <div class="body">
              <div class="row"><span class="pill">Direct</span><span class="pill">Smart</span></div>
              <div class="desc">Second card body — was getting lost before the fix</div>
            </div>
          </div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">card-three</div><div>⋯</div></div>
        <div class="collapse">
          <div class="collapse-wrapper"><div class="collapse-inner">
            <div class="body">
              <div class="row"><span class="pill">deepseek-v4</span><span class="pill">glm-4.7</span></div>
              <div class="desc">Third card body — also was getting lost</div>
            </div>
          </div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">card-four</div><div>⋯</div></div>
        <div class="collapse">
          <div class="collapse-wrapper"><div class="collapse-inner">
            <div class="body">
              <div class="row"><span class="pill">Default</span></div>
              <div class="desc">Fourth card body</div>
            </div>
          </div></div>
        </div>
      </div>
    </div>
  </body>
</html>
