<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:#fff;font:700 15px sans-serif}
.m{display:inline-block;width:170px;height:110px;margin:6px;vertical-align:top;color:#fff;padding:8px;box-sizing:border-box;background:linear-gradient(135deg,#e8553d,#2a7fd4)}
.a{-webkit-mask-image:radial-gradient(circle at 30% 40%,#000 0,#000 35%,transparent 70%);mask-image:radial-gradient(circle at 30% 40%,#000 0,#000 35%,transparent 70%)}

.d{mask-image:radial-gradient(circle at 0 0,#000 0 60px,transparent 61px),radial-gradient(circle at 100% 100%,#000 0 60px,transparent 61px)}
</style></head><body><div class="m a">radial</div><div class="m b">ellipse px</div><div class="m c">intersect</div><div class="m d">union</div></body></html>
