<!doctype html>
<html>
  <head>
    <style>
      body { margin: 0; font-family: sans-serif; background: #f0f2f5; }
      .card {
        margin: 24px; padding: 16px; background: #fff;
        border: 1px solid #d9d9d9; border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); width: 300px;
      }
      h1 { font-size: 20px; color: #1677ff; margin: 0 0 8px; }
      p { color: #333; line-height: 1.6; }
      .btn {
        display: inline-block; padding: 6px 16px;
        background: #1677ff; color: #fff; border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello SVG</h1>
      <p>This is a paragraph of text that should wrap onto multiple lines inside the card to test line breaking.</p>
      <span class="btn">Primary</span>
    </div>
  </body>
</html>
