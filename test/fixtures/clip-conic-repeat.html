<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:#fff;font:700 14px sans-serif}
.g{display:inline-block;width:180px;height:120px;margin:6px;vertical-align:top;color:#fff;padding:8px;box-sizing:border-box;border-radius:10px}
.a{background:conic-gradient(from 20deg at 30% 40%,#1d4ed8,#9333ea,#f59e0b,#1d4ed8)}
.b{background:conic-gradient(#f00 0 25%,#0a0 0 50%,#00f 0 75%,#fc0 0)}
.c{background:repeating-linear-gradient(45deg,#222 0 10px,#e33 10px 20px)}
.d{background:repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 1px,transparent 1px 8px),#4f8cff}
.e{background:linear-gradient(135deg,#ff7a18,#af002d);clip-path:polygon(50% 0,100% 100%,0 100%)}
.f{background:#2a7;clip-path:circle(50% at 50% 50%);}
.h{background:#c33;clip-path:inset(10px 20px round 16px)}
.i{background:#222;clip-path:ellipse(45% 35% at 50% 50%)}
</style></head><body>
<div class="g a">conic from/at</div><div class="g b">hard stops</div><div class="g c">repeating 45°</div><div class="g d">hairlines</div>
<div class="g e">polygon</div><div class="g f">circle</div><div class="g h">inset round</div><div class="g i">ellipse</div>
</body></html>
