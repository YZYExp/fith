<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;font:13px/1.4 system-ui,sans-serif;background:#faf9f5;color:#333}
aside{position:fixed;left:0;top:0;width:240px;height:420px;display:flex;flex-direction:column;background:#f5f4ee;border-right:1px solid #ddd}
.dframe-sidebar-body{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px;padding:12px 8px 6px;overflow:clip}
.fade{display:flex;flex-direction:column;flex:1;min-height:0}
.top{flex:none}
.search{height:32px;border-radius:9999px;background:#ebe9e0;display:flex;align-items:center;padding:0 10px;color:#777}
.scroll{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 4px 8px;margin:-4px -8px 0 -4px;scrollbar-gutter:stable}
.contents{display:contents}.hidden{display:none}
.group{display:flex;flex-direction:column;gap:1px}
.label{padding:12px 4px 4px;font-size:12px;color:#888}
.row{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:9999px;color:#555}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;mask-image:linear-gradient(to right,black calc(100% - 24px),transparent 100%)}
.dot{width:6px;height:6px;border-radius:50%;border:1px solid currentColor;opacity:.5}
.footer{flex:none;height:32px;display:flex;align-items:center;gap:8px;padding:0 8px}
.av{width:22px;height:22px;border-radius:50%;background:#e5e3da;display:inline-flex;align-items:center;justify-content:center;font-size:9px}
</style></head><body>
<aside><div class="dframe-sidebar-body" id="frame-peek-popover"><div class="fade">
 <div class="top"><div class="search">Search</div></div>
 <div class="scroll" id="nav"></div>
</div>
<div class="footer"><span class="av">YF</span><span>YZ · Max</span></div></div></aside>
<script>
const nav=document.getElementById('nav');let h='';
for(let g=0;g<6;g++){h+=`<div class="group"><div class="label">Group ${g}</div><div class="hidden"><div class="row">collapsed ${g}</div></div><div class="contents">`;
 for(let i=0;i<24;i++)h+=`<div class="row"><span class="dot"></span><span class="t">Session ${g}-${i} 一些较长的会话标题文字用来触发渐隐遮罩 and more words</span></div>`;
 h+='</div></div>';}
nav.innerHTML=h;nav.scrollTop=700;
</script></body></html>
