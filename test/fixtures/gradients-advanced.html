<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:#fff;font:14px sans-serif}
.g{display:inline-block;width:180px;height:110px;margin:6px;border-radius:12px;vertical-align:top;color:#fff;font-weight:700;padding:6px;box-sizing:border-box}
.a{background:linear-gradient(to bottom right,#ff7a18,#af002d)}
.b{background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0)),#3a7bd5}
.c{background:radial-gradient(circle at 30% 30%,#fff 0,#4f8cff 60%,#102a6b 100%)}
.d{background:radial-gradient(ellipse at center,#ffe259 0%,#ffa751 100%)}
.e{background:radial-gradient(circle at 100% 0,rgba(255,0,128,.8),rgba(255,0,128,0) 70%),linear-gradient(135deg,#222,#556)}
.f{background:linear-gradient(#fff 40px,rgba(255,255,255,0) 80px),#c33;color:#222}
.h{background:radial-gradient(closest-side,#0f0,#050);}
.i{background:linear-gradient(90deg,#f00 0%,#f00 30%,#00f 30%,#00f 100%)}
</style></head><body>
<div class="g a">to bottom right</div><div class="g b">alpha scrim</div><div class="g c">circle at 30%</div><div class="g d">ellipse</div>
<div class="g e">two layers</div><div class="g f">px stops</div><div class="g h">closest-side</div><div class="g i">hard stop</div>
</body></html>
